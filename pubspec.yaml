publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  crypto: ^3.0.3
  shared_preferences: ^2.2.0
  media_kit: ^1.1.11
  media_kit_libs_audio: ^1.0.5
  window_manager: ">=0.4.3 <1.0.0"

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
